<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fiches SF6</title>
<meta name="description" content="">
<style>
/* Base styles (reset) */
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single A4 "command card" — header strip, legend bar, then two columns (moves | combos). Screen and print share it. */
:root {
  --paper: #f5f3f4;
  --card: #ffffff;
  --ink: #1d1a1f;
  --muted: #625b66;
  --line: #ddd6dc;
  --accent: #8e1b2c;      /* Akuma crimson */
  --dir-bg: #2a262d;      /* direction tiles */
  --dir-fg: #ffffff;
  --btn-l: #2b7bd0;       /* light */
  --btn-m: #d9a000;       /* medium */
  --btn-h: #d0372a;       /* heavy */
  --btn-any: #6c6472;     /* any strength */
  --drive: #2f9a57;       /* Drive gauge green */
  --sa: #6a3fb0;          /* Super Arts */
  --hold: #d99a00;        /* held direction (gold arrow in the game) */
  --warn-bg: #fff3d6;
  --warn-fg: #6b4b00;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
/* Light only, whatever the viewer's theme */
:root, :root[data-theme="dark"] { color-scheme: light; }
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 14px; line-height: 1.35;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.sheet { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }

/* Header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; border-bottom: 3px solid var(--accent); padding-bottom: 8px; }
.kanji { font-family: serif; font-size: 44px; line-height: 1; color: var(--accent); font-weight: 700; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 34px; letter-spacing: .02em; line-height: 1; margin: 0; text-transform: uppercase; }
h1 small { font-weight: 600; color: var(--muted); font-size: 18px; letter-spacing: .06em; margin-left: 6px; }

/* Legend */
.lang { display: flex; justify-content: flex-end; gap: 4px; }
.lang button { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; padding: 2px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--card); color: var(--ink); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(11em, 1fr)); gap: 8px; }
.card { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); text-decoration: none; font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }
.card:hover { border-color: var(--accent); }
.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .ck { font-family: serif; font-size: 26px; line-height: 1; color: var(--accent); min-width: 2.2em; text-align: center; white-space: nowrap; }
.card span:last-child { white-space: nowrap; }
.note .seq { display: inline-flex; vertical-align: middle; margin: 0 2px; }
.alts { display: grid; gap: 3px; justify-items: start; }
.alts .or { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-left: 4px; }
.homelink { color: inherit; text-decoration: none; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 12px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink); background: var(--card); text-decoration: none; }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: grid; gap: 6px; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.lrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding-top: 6px; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; padding-top: 0; }
.ltitle { font-family: var(--f-display); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); min-width: 8.5em; }
.legend .lrow > span { display: inline-flex; align-items: center; gap: 5px; }

/* Columns */
/* Top block: moves in two flowing columns; bottom block: combos on the full width */
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
/* Character page, top block: fixed columns. Left: unique attacks + throws. Right: special moves + super arts. */
.topgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.stack { display: grid; gap: 10px; align-content: start; min-width: 0; }
@media (max-width: 820px) { .cols, .topgrid { grid-template-columns: minmax(0, 1fr); } }
section { display: grid; gap: 4px; min-width: 0; }
h2 { font-family: var(--f-display); font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: .08em; margin: 6px 0 2px; color: var(--accent); display: flex; align-items: baseline; gap: 8px; }
h2 .count { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
h3 { font-family: var(--f-display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .07em; margin: 8px 0 0; color: var(--muted); }

/* Move rows */
.rows { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr); gap: 2px 10px; padding: 5px 9px; border-top: 1px solid var(--line); align-items: center; }
.row:first-child { border-top: 0; }
.row .name { font-weight: 600; }
.row .name .tag { margin-left: 4px; }
.row .note { grid-column: 2; font-size: 12px; color: var(--muted); }
.row .note.names { color: var(--ink); }
.row.cb { grid-template-columns: minmax(0, 12.5em) minmax(0, 1fr); }
.row.sub .name { padding-left: 12px; font-weight: 500; color: var(--muted); }
.row.sub .name::before { content: "↳ "; }
@media (max-width: 460px) { .row { grid-template-columns: minmax(0, 1fr); } .row .note { grid-column: 1; } }

/* Combos */
.combo { padding: 6px 9px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.combo:first-child { border-top: 0; }
.combo .note { font-size: 12px; color: var(--muted); }
.combo .ctitle { font-weight: 700; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
.cost { font-size: 12px; font-weight: 500; color: var(--muted); display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; }
.odver { display: inline-flex; align-items: center; gap: 4px; }
.odpair { display: inline-flex; gap: 1px; }
.odpair .btn svg { width: 15px; height: 15px; }
.name .gauges { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin-top: 2px; }
.gauge { display: inline-flex; align-items: center; gap: 3px; }
.gauge svg { width: 22px; height: 10px; flex: none; }
.gauge b { font-family: var(--f-display); font-weight: 800; font-size: 13px; color: var(--ink); line-height: 1; }
.cost .none { font-weight: 600; }
.cost .dot { color: var(--line); }

/* Notation rendering */
.seq { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 2px; min-width: 0; }
.mv { display: inline-flex; align-items: center; gap: 1px; white-space: nowrap; }
/* In-game style: solid block arrows without background; round dark buttons with a light ring and white fist / foot */
svg.dir { width: 18px; height: 18px; flex: none; }
svg.dir .a { fill: var(--ink); }
svg.dir.held .a { fill: var(--hold); }
svg.dir.n circle { fill: none; stroke: var(--ink); stroke-width: 1.8; }
svg.dir.n text { fill: var(--ink); font: 800 11.5px var(--f-display); }
.btn { display: inline-flex; align-items: center; gap: 0; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn svg .bg { fill: #2d2b2c; stroke: #d9d2f4; stroke-width: .9; }
.btn svg .g { fill: #f4f2f7; }
.btn b { font-family: var(--f-display); font-weight: 800; font-size: 13px; color: var(--ink); margin-left: 1px; line-height: 1; }
/* Button colors sampled from the in-game command list: any = dark, L = teal, M = olive yellow, H = red */
.btn.A { --b-bg: #2d2b2c; --b-ring: #d9d2f4; --b-gl: #f4f2f7; }
.btn.L { --b-bg: #22808c; --b-ring: #a6c8ee; --b-gl: #9fe3ec; }
.btn.M { --b-bg: #b3b028; --b-ring: #e6e29e; --b-gl: #f4f08a; }
.btn.H { --b-bg: #c23a2e; --b-ring: #f0b4b4; --b-gl: #f6a49a; }
.press { display: inline-flex; align-items: center; gap: 2px; }
.plus { color: var(--muted); font-weight: 700; font-size: 12px; margin: 0 1px; }
.jump { font-family: var(--f-display); font-weight: 700; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; margin-right: 2px; text-transform: uppercase; }
.sep { color: var(--accent); font-weight: 800; font-size: 15px; padding: 0 3px; line-height: 1; }
.sep.tri { font-size: 10px; padding: 0 3px; }
.sep.link { color: var(--muted); font-size: 16px; padding: 0 3px 0 0; }
.chip { font-family: var(--f-display); font-weight: 700; font-size: 11.5px; letter-spacing: .05em; border-radius: 3px; padding: 1px 5px; line-height: 1.3; white-space: nowrap; }
.chip.drive { background: var(--drive); color: #fff; }
.chip.od { background: var(--drive); color: #fff; font-size: 10px; padding: 0 3px; margin-left: 2px; }
.chip.pc, .chip.ch { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.chip.sa { background: var(--sa); color: #fff; }
.chip.hold { background: transparent; color: var(--muted); border: 1px dashed var(--muted); font-size: 10.5px; }
.tag { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .05em; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; text-transform: uppercase; vertical-align: 1px; }
.tag.air { color: var(--sa); border-color: var(--sa); }
.flag { display: inline-block; background: var(--warn-bg); color: var(--warn-fg); border-radius: 3px; padding: 0 4px; font-size: 11.5px; font-weight: 600; }

.callout { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; }

/* Print: compact A4, light colors, two columns */
@page { size: A4 portrait; margin: 7mm; }
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --paper: #fff; --card: #fff; --ink: #000; --muted: #444; --line: #bbb; --accent: #8e1b2c;
    --dir-bg: #222; --dir-fg: #fff; --btn-l: #2b7bd0; --btn-m: #c99400; --btn-h: #d0372a; --btn-any: #6c6472;
    --drive: #2f9a57; --sa: #6a3fb0; --warn-bg: #f3f3f3; --warn-fg: #333;
    color-scheme: light;
  }
  body { font-size: 8.4pt; padding: 0; line-height: 1.22; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { max-width: none; gap: 5px; }
  header { padding-bottom: 3px; border-bottom-width: 2px; }
  .kanji { font-size: 26px; } h1 { font-size: 20px; } h1 small { font-size: 11px; }
  .tabs, .lang { display: none; }
  .legend { font-size: 7pt; padding: 3px 6px; gap: 2px 10px; }
  .cols { gap: 8px; }
  .topgrid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 4px 10px; }   /* an A4 page is narrower than the phone breakpoint */
  .stack { gap: 4px; }
  .cols > div:nth-child(2) { break-before: page; }
  h2 { font-size: 10.5pt; margin: 2px 0 0; } h3 { font-size: 8pt; margin: 3px 0 0; }
  .row { padding: 2px 5px; grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr); }
  .row .note, .combo .note { font-size: 7pt; }
  .combo { padding: 2px 5px; gap: 0; }
  .combo .ctitle { font-size: 7.6pt; }
  .cost { font-size: 7pt; } .gauge svg { width: 15px; height: 7px; } .gauge b { font-size: 8pt; }
  svg.dir { width: 12px; height: 12px; } .btn svg { width: 13px; height: 13px; }
  .btn b { font-size: 8.5pt; } .sep { font-size: 10pt; padding: 0 1px; }
  .chip { font-size: 7pt; padding: 0 3px; } .tag { font-size: 6.5pt; }
  .callout { font-size: 7pt; padding: 3px 6px; }
  .row, .combo { break-inside: avoid; }
  a { color: inherit; text-decoration: none; }
}
</style>
</head>

<script>
// ---------- Notation ----------
// Tokens separated by spaces:
//   moves     [j.][digits][buttons]   e.g. 236P, 2MK, j.214K, 623HP, 214PP (OD), 6KKK, LP+LK, 4LP+LK
//   separators  >  (cancel)   ,  (link)   ~  (then)   /  (or)   ( )   +   N (neutral icon, e.g. > ( N / 6 ) + MP+MK)
//   chips     DR DI DP  [PC] [CH] [hold] [OD] SA1 SA2 SA3 CA
const DIR_ANGLE = { 6: 0, 3: 45, 2: 90, 1: 135, 4: 180, 7: 225, 8: 270, 9: 315 };
const BTN_RE = /^(LP|MP|HP|LK|MK|HK|PPP|KKK|PP|KK|P|K)(\+(LP|MP|HP|LK|MK|HK))*$/;
const MOVE_RE = /^(j\.)?(?:\[([1-9])\])?([1-9]*)(.*)$/; // [4]6P = hold back, then forward + P
const CHIPS = {
  'DR': ['drive', 'DR'], 'DI': ['drive', 'DI'], 'DP': ['drive', 'PARRY'],
  '[PC]': ['pc', 'PC'], '[CH]': ['ch', 'CH'], '[hold]': ['hold', 'hold'],
  'SA1': ['sa', 'SA1'], 'SA2': ['sa', 'SA2'], 'SA3': ['sa', 'SA3'], 'CA': ['sa', 'CA'],
};
const SEPS = { '>': ['sep tri', '▶'], ',': ['sep link', ','], '~': ['sep', '~'], '/': ['sep link', '/'], '(': ['sep link', '('], ')': ['sep link', ')'], '+': ['plus', '+'] };

function parseToken(t) {
  if (SEPS[t]) return { kind: 'sep', cls: SEPS[t][0], text: SEPS[t][1] };
  if (CHIPS[t]) return { kind: 'chip', cls: CHIPS[t][0], text: CHIPS[t][1] };
  if (t === 'N') return { kind: 'move', jump: false, held: 0, dirs: [5], btn: '' }; // neutral shown as its own icon
  const m = MOVE_RE.exec(t);
  if (!m) return null;
  const [, jump, held, digits, btn] = m;
  const dirs = (held || '') + digits;
  if (!dirs && !btn) return null;
  if (btn && !BTN_RE.test(btn)) return null;
  return { kind: 'move', jump: !!jump, held: held ? 1 : 0, dirs: dirs.split('').map(Number), btn: btn || '' };
}
function parseSeq(s) {
  return s.trim().split(/\s+/).map(t => ({ t, p: parseToken(t) }));
}
function buttonsOf(btn) {
  // returns list of {glyph:'fist'|'foot', str:'L'|'M'|'H'|'A'} and an od flag
  if (!btn) return { list: [], od: false };
  // OD: show the two buttons to press (L+M, as in the source); any two of the same kind work in game
  if (btn === 'PP' || btn === 'KK') {
    const g = btn[0] === 'P' ? 'fist' : 'foot';
    return { list: [{ glyph: g, str: 'A' }, { glyph: g, str: 'A' }], od: true };
  }
  if (/^(PPP|KKK|P|K)$/.test(btn)) {
    const g = btn[0] === 'P' ? 'fist' : 'foot';
    return { list: Array.from(btn, () => ({ glyph: g, str: 'A' })), od: btn.length === 2, ex: btn.length === 3 };
  }
  return { list: btn.split('+').map(b => ({ glyph: b[1] === 'P' ? 'fist' : 'foot', str: b[0] })), od: false };
}

const t = k => UI[LANG][k];
// Localized field: <field>_fr when the page is in French and the translation exists, else the base (English) field.
const L = (o, k) => (LANG === 'fr' && o[k + '_fr'] != null ? o[k + '_fr'] : o[k]);

// ---------- Data (Classic controls) ----------
// Common to every character: Drive moves and mechanics.
const COMMON_DRIVE = [
  { n: 'Drive Impact', chips: ['DI'], i: 'HP+HK', drive: [[1, '1 bar of Drive gauge', '1 barre de jauge Drive']] },
  { n: 'Drive Reversal', i: '6HP+HK', note: 'While blocking.', note_fr: 'Pendant la garde.', drive: [[2, '2 bars of Drive gauge', '2 barres de jauge Drive']] },
  { n: 'Drive Parry', chips: ['DP'], i: 'MP+MK',
    note: 'Parry: blocks without taking chip damage and also parries projectiles. Does not parry throws. Drains Drive while held; a successful parry gives some back. Also used to start a Drive Rush ({{66}}). Empty gauge: Burnout, no Parry or Drive Rush.',
    note_fr: 'Parade : bloque sans subir de dégâts à travers la garde (pas de chip damage) et pare aussi les projectiles. Ne pare pas les projections. Consomme du Drive tant qu’on la maintient ; une parade réussie en rend un peu. Sert aussi à lancer un Drive Rush ({{66}}). Jauge vide : Burnout, plus de Parry ni de Drive Rush.' },
  { n: 'Drive Rush', chips: ['DR'], i: '',

    note: 'When hitting with a special-cancelable move.', note_fr: 'En touchant avec un coup spécial cancelable.',
    drive: [[3, '3 bars of Drive gauge', '3 barres de jauge Drive']] },
];
const COMMON_MECHANICS = [
  { n: 'Punish Counter', chips: ['[PC]'], i: '[PC]',
    note: 'Hit the opponent during the recovery of their move (whiffed or blocked). More damage and stun, drains their Drive gauge.',

// ---------- Characters ----------
// Data is loaded on demand: data/characters.json (index) and data/<id>.json (one file per character).
// To add a character, create data/<id>.json (same shape as the others) and add it to data/characters.json.
// Inputs use the notation described above.
const CHARACTERS = {}; // id -> data, filled when a character is first shown
let C = null; // current character

// ---------- Rendering ----------
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function dirSvg(d, held) {
  if (d === 5) return `<svg class="dir n" viewBox="0 0 20 20" aria-label="${t('neutral')}"><circle cx="10" cy="10" r="8.2"/><text x="10" y="14.2" text-anchor="middle">N</text></svg>`;
  return `<svg class="dir${held ? ' held' : ''}" viewBox="0 0 20 20" aria-hidden="true"${held ? ` aria-label="${t('holdArrow')}"` : ''}><g transform="rotate(${DIR_ANGLE[d]} 10 10)"><path class="a" d="M2 7.4h8.6V3l7.9 7-7.9 7v-4.4H2z"/></g></svg>`;
}
function btnHtml(b) {
  // Strength letters: L (Light), M (Medium), H (Heavy)
  const letter = b.str === 'A' ? '' : `<b>${b.str}</b>`;
  return `<span class="btn ${b.str}"><svg viewBox="0 0 20 20" aria-hidden="true"><use href="#${b.glyph}"/></svg>${letter}</span>`;
}
const DIR_WORD = { 1: '↙', 2: '↓', 3: '↘', 4: '←', 5: 'N', 6: '→', 7: '↖', 8: '↑', 9: '↗' };
function renderSeq(s) {
  const wrap = el('span', 'seq');
  for (const { t: tok, p } of parseSeq(s)) {
    if (!p) { wrap.append(el('span', 'flag', tok)); continue; }
    if (p.kind === 'sep') { wrap.append(el('span', p.cls, p.text)); continue; }
    if (p.kind === 'chip') { wrap.append(el('span', 'chip ' + p.cls, tok === '[hold]' ? t('held') : p.text)); continue; }
    const mv = el('span', 'mv');
    mv.setAttribute('aria-label', tok);
    let h = p.jump ? `<span class="jump">${t('jump')}</span>` : '';
    // Standing moves (5 + button) show no direction, as in the game
    const dirs = p.btn && p.dirs.length === 1 && p.dirs[0] === 5 ? [] : p.dirs;
    h += dirs.map((d, i) => dirSvg(d, i < (p.held || 0))).join('');
    const bs = buttonsOf(p.btn);
    if (dirs.length && bs.list.length) h += '<span class="plus">+</span>';
    // Simultaneous buttons sit side by side without "+", as in the game ("+" only links direction and buttons)
    if (bs.list.length) h += '<span class="press">' + bs.list.map(btnHtml).join('') + '</span>';
    mv.innerHTML = h;
    wrap.append(mv);
  }
  return wrap;
}
// An input is a string, or a list of alternatives. A " / " inside a string also means alternatives:
// each one goes on its own line, separated by "or" (translated to "ou" in French).
function seqBlock(i) {
  const list = Array.isArray(i) ? i : (typeof i === 'string' && i.includes(' / ') ? i.split(' / ') : null);
  if (!list) return i ? renderSeq(i) : el('span');
  const alt = el('div', 'alts');
  list.forEach((s, k) => { if (k) alt.append(el('span', 'or', t('or'))); alt.append(renderSeq(s)); });
  return alt;
}
// Notes can embed notation: {{MP+MK}} is rendered with the same icons as the move lists
const rich = s => s.replace(/\{\{(.+?)\}\}/g, (_, n) => renderSeq(n).outerHTML);
function renderRows(id, data) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  box.closest('section').hidden = !data.length;
  for (const r of data) {
    const row = el('div', 'row' + (r.sub ? ' sub' : ''));
    const name = el('div', 'name', L(r, 'n'));
    if (r.air) name.append(el('span', 'tag air', 'air'));
    if (r.flag) name.append(' ', el('span', 'flag', '!'));
    if (r.chips) for (const k of r.chips) { const [cls, txt] = CHIPS[k]; name.append(' ', el('span', 'chip ' + cls, txt)); }
    // Gauge icons right after the name, as in the in-game command list
    const g = [];
    if (r.lvl && !r.sub) g.push(gaugeHtml('sa', Number(r.lvl.slice(2))));
    // OD version: the two generic buttons to press (fists or feet, from the input) then its Drive cost
    if (r.od) {
      const m = String([].concat(r.i)[0] || '').match(/[PK](?=[^PK]*$)/);
      const two = m ? ['fist', 'foot'][+(m[0] === 'K')] : null;
      const pair = two ? `<span class="odpair">${btnHtml({ glyph: two, str: 'A' })}${btnHtml({ glyph: two, str: 'A' })}</span>` : '';
      g.push(`<span class="odver" title="${t('gOD')}">${pair}${gaugeHtml('drive', 2, t('gOD'))}</span>`);
    }
    if (r.drive) g.push(r.drive.map(([n, en, fr]) => gaugeHtml('drive', n, LANG === 'fr' ? fr : en)).join('<span class="dot">/</span>'));
    if (g.length) name.append(el('span', 'gauges', g.join(' ')));
    row.append(name, seqBlock(r.i));
    if (L(r, 'note')) row.append(el('div', 'note', rich(L(r, 'note'))));
    box.append(row);
  }
}
function renderCombos() {

      // Same row layout as specials / super arts: name + gauge icons | notation, details below
      const k = comboCost(c.s);
      const dT = c.dr !== undefined ? c.dr : k.drive.total;
      const sT = c.su !== undefined ? c.su : k.sup.total;
      const icons = [dT && gaugeHtml('drive', dT), sT && gaugeHtml('sa', sT)].filter(Boolean).join(' ');
      const explicit = c.dr !== undefined || c.su !== undefined;
      const detail = explicit || grp.trial ? '' : [k.drive.total && k.drive.parts.join(' + '), k.sup.total && k.sup.parts.join(' + ')].filter(Boolean).join(' · ');
      const meta = [c.dmg && t('dmg')(c.dmg), t('pos')[c.pos] || c.pos, t('diff')[c.df]].filter(Boolean).join(' · ');
      const d = el('div', 'row cb');
      const nm = el('div', 'name', L(c, 't') || '');
      if (icons) nm.append(el('span', 'gauges', icons));
      d.append(nm, seqBlock(c.s));
      if (c.names) d.append(el('div', 'note names', L(c, 'names').join(' · ')));
      const txt = [meta, detail, L(c, 'note')].filter(Boolean).join(' · ');
      if (txt || c.flag) d.append(el('div', 'note', (c.flag ? '<span class="flag">!</span> ' : '') + txt));
      rows.append(d);
    }
    box.append(rows);
  }
  document.getElementById('combo-count').textContent = [nt && t('trials')(nt), n && t('combos')(n)].filter(Boolean).join(' · ');
}
function renderLegend() {
  const L_ = document.getElementById('legend');
  L_.innerHTML = '';
  for (const [title, items] of t('legend')) {
    const row = el('div', 'lrow');
    row.append(el('b', 'ltitle', title));
    for (const it of items) {
      const sp = el('span');
      // 'j.' alone is the jump tag, without a button
      if (it[0] === 'j.') { const j = el('span', 'seq'); j.innerHTML = `<span class="mv"><span class="jump">${t('jump')}</span></span>`; sp.append(j, document.createTextNode(it[1])); }
      // '[4]' alone is the golden "direction to hold" arrow, without the rest of the motion
      else if (it[0] === '[4]') { const h = el('span', 'seq'); h.innerHTML = `<span class="mv">${dirSvg(4, true)}</span>`; sp.append(h, document.createTextNode(it[1])); }
      else if (it[0]) { sp.append(renderSeq(it[0]), document.createTextNode(it[1])); }
      else { sp.innerHTML = `${gaugeHtml(it[1], it[1] === 'drive' ? 2 : 1)} ${it[2]}`; }
      row.append(sp);
    }
    L_.append(row);
  }
}

// ---------- Gauge cost of a combo ----------
// Drive: DR after a normal = cancel (3 bars); DR after a special = from Parry (1 bar); OD = 2; Drive Impact = 1.
// Super: SA1 = 1, SA2 = 2, SA3 = 3.
// Built from the current character's Super Arts (simple motions only): input -> [name, level]
let SUPER_MOVES = {};
function comboCost(s) {
  const drive = [], sup = [];
  let prev = null;
  for (const { t: tok, p } of parseSeq(s)) {
    if (!p) continue;
    if (p.kind === 'chip' && tok === 'DR') {
      const afterSpecial = prev && prev.dirs.length >= 3;
      drive.push(afterSpecial ? [t('drParry'), 1] : [t('drCancel'), 3]);
    } else if (p.kind === 'chip' && tok === 'DI') {
      drive.push(['Drive Impact', 1]);
    } else if (p.kind === 'move') {
      const key = (p.jump ? 'j.' : '') + p.dirs.join('') + p.btn;
      const generic = (p.jump ? 'j.' : '') + p.dirs.join('') + (p.btn.includes('P') ? 'P' : 'K');
      if (p.dirs.length === 6 && SUPER_MOVES[generic]) sup.push(SUPER_MOVES[generic]);
      else if (p.btn === 'PP' || p.btn === 'KK') drive.push(['OD', 2]);
      prev = p;
    }
  }
  const group = list => {
    const m = new Map();
    for (const [label, n] of list) { const e = m.get(label) || { n, c: 0 }; e.c++; m.set(label, e); }
    return { total: list.reduce((a, [, n]) => a + n, 0), parts: [...m].map(([l, e]) => (e.c > 1 ? `${l} ×${e.c}` : l)) };
  };
  return { drive: group(drive), sup: group(sup) };
}
// In-game gauge icon: slanted bar (green = Drive, pink = Super) followed by the number of bars
function gaugeHtml(kind, n, title) {
  const c = kind === 'drive' ? ['#14920a', '#72e45c'] : ['#c23f7c', '#f3a8ca'];
  return `<span class="gauge" title="${title || (kind === 'drive' ? t('gDrive') : t('gSuper'))}"><svg viewBox="0 0 22 10" aria-hidden="true"><path d="M1 1h15.5l4.5 8H5.5z" fill="${c[0]}" stroke="${c[1]}" stroke-width="1.2" stroke-linejoin="round"/></svg><b>${n}</b></span>`;
}
function costHtml(s) {
  const { drive, sup } = comboCost(s);
  if (!drive.total && !sup.total) return '';
  const out = [];
  if (drive.total) out.push(`${gaugeHtml('drive', drive.total)} ${drive.parts.join(' + ')}`);
  if (sup.total) out.push(`${gaugeHtml('sa', sup.total)} ${sup.parts.join(' + ')}`);
  return out.join('<span class="dot">·</span>');
}

// Validation helper (also used outside the browser): every token must parse.
function allRows(c) {
  return [...(c.uniques || []), ...(c.specials || []), ...(c.throws || []), ...(c.supers || [])];
}
function unknownTokens() {
  const out = [];
  const check = s => parseSeq(s).filter(x => !x.p).forEach(x => out.push(`${x.t} in "${s}"`));
  [...COMMON_DRIVE, ...COMMON_MECHANICS].forEach(r => [].concat(r.i || []).forEach(check));
  for (const c of Object.values(CHARACTERS)) {
    allRows(c).forEach(r => check(r.i));
    (c.combos || []).forEach(g => g.items.forEach(x => check(x.s)));
  }
  return out;
}

// ---------- Character selection (data loaded on demand) ----------
let INDEX = [];
let REQ = 0;
async function loadJson(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`${path} : HTTP ${r.status}`);
  return r.json();
}
function useCharacter(id) {
  C = CHARACTERS[id];
  SUPER_MOVES = {};
  for (const r of C.supers || []) if (r.lvl && /^(j\.)?\d+[PK]$/.test(r.i)) SUPER_MOVES[r.i] = [r.n, Number(r.lvl.slice(2))];
  return C;
}
function currentId() {
  const id = location.hash.slice(1);
  return INDEX.some(c => c.id === id) ? id : 'home'; // no hash (the site root) = home page
}
function renderTabs(activeId) {
  const nav = document.getElementById('tabs');
  nav.hidden = INDEX.length < 2;
  nav.innerHTML = '';
  const home = el('a', 'tab' + (activeId === 'home' ? ' on' : ''), t('home'));
  home.href = '#';
  nav.append(home);
  // Alphabetical order
  const sorted = [...INDEX].sort((a, b) => a.name.localeCompare(b.name, LANG, { sensitivity: 'base' }));
  for (const c of sorted) {
    const a = el('a', 'tab' + (c.id === activeId ? ' on' : ''), c.name);
    a.href = '#' + c.id;
    nav.append(a);
  }
}
function showHome() {
  C = null;
  document.getElementById('charview').hidden = true;
  document.getElementById('homeview').hidden = false;
  document.getElementById('cname').textContent = t('homeName');
  document.getElementById('kanji').hidden = true;
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  for (const c of [...INDEX].sort((a, b) => a.name.localeCompare(b.name, LANG, { sensitivity: 'base' }))) {
    const a = el('a', 'card');
    a.href = '#' + c.id;
    if (c.kanji) a.append(el('span', 'ck', c.kanji));
    a.append(el('span', null, c.name));
    cards.append(a);
  }
  renderRows('hdrive', COMMON_DRIVE);
  renderRows('hmech', COMMON_MECHANICS);
}function showError(msg) {
  const e = document.getElementById('loaderr');
  e.textContent = msg || '';
  e.hidden = !msg;
}
async function showCharacter(id) {
  const req = ++REQ;
  renderTabs(id);
  if (id === 'home') { showError(''); showHome(); window.scrollTo(0, 0); return; }
  try {
    if (!CHARACTERS[id]) CHARACTERS[id] = await loadJson(`data/${id}.json`);
  } catch (err) {
    if (req === REQ) showError(t('errChar')(id, err.message) + t('hint'));
    return;
  }
  if (req !== REQ) return; // a newer selection superseded this one
  showError('');
  document.getElementById('charview').hidden = false;
  document.getElementById('homeview').hidden = true;
  useCharacter(id);
  // Name and kanji have a single source: data/characters.json (also used by the tabs and the home page)
  const entry = INDEX.find(c => c.id === id);
  document.getElementById('cname').textContent = entry.name;
  const k = document.getElementById('kanji');
  k.textContent = entry.kanji || '';
  k.hidden = !entry.kanji;
  renderRows('uniques', C.uniques || []);
  renderRows('specials', C.specials || []);
  renderRows('system', C.throws || []);
  renderRows('supers', C.supers || []);
  renderCombos();
}
// Re-render everything in the current language (character data is already cached)
function refresh() {
  applyStatic();
  renderLangSwitch();
  renderLegend();
  if (INDEX.length) showCharacter(currentId());
}
async function start() {
  applyStatic();
  renderLangSwitch();
  try {
    INDEX = await loadJson('data/characters.json');
  } catch (err) {
    showError(t('errList')(err.message) + t('hint'));
    return;
  }
  renderLegend();
  await showCharacter(currentId());
  addEventListener('hashchange', () => showCharacter(currentId()));
}
if (typeof document !== 'undefined') {
  start();
} else if (typeof module !== 'undefined') {
  module.exports = { unknownTokens, useCharacter, comboCost, CHARACTERS };
}
</script>

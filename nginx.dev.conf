# Dev configuration: files are mounted from the host and never cached,
# so a browser refresh (F5) always shows the latest edit.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    sendfile off;                          # mounted files can be served late on Docker Desktop otherwise
    add_header Cache-Control "no-store" always;

    location ~ /\. {                       # the whole folder is mounted: never serve .git and other dotfiles
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
